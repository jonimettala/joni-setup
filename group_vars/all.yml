---
# Customize these to your own needs

homebrew_taps: []

homebrew_formulae:
  - bash
  - gh       # GitHub CLI
  - nvm
  - pymupdf
  - awscli

homebrew_casks:
  - 1password-cli
  - claude-code
  - copilot-cli
  - iterm2
  - drawio
  - obsidian
  - postman
  - raycast

dotfiles_dir: "{{ playbook_dir }}/dotfiles"
dotfiles_files:
  - .zshrc
  - .gitconfig
  - .gitignore_global

iterm2_prefs_dir: "{{ playbook_dir }}/iterm2"

nvm_version: "v0.40.1"
default_node_version: "node"  # latest stable

# sdkman is only installed — install Java versions yourself: sdk install java

# Private repo with personal Claude Code skills and CLAUDE.md, linked into ~/.claude
claude_config_repo: "git@github.com:jonimettala/claude-config.git"
claude_config_dir: "{{ ansible_facts['env']['HOME'] }}/dev/repos/claude-config"
claude_dir: "{{ ansible_facts['env']['HOME'] }}/.claude"
